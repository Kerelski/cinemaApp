spring.application.name=user-service
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://cinema_user:cinema_user@localhost:27018/user_service?authSource=admin}

security.jwt.secret=${JWT_SECRET:change-this-local-development-secret-key}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

app.admin.email=${ADMIN_EMAIL:admin@cinema.local}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.first-name=${ADMIN_FIRST_NAME:System}
app.admin.last-name=${ADMIN_LAST_NAME:Admin}
