spring.application.name=reservation-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/reservation_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:reservation_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:reservation_service}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
