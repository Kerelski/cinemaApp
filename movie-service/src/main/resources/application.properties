spring.application.name=movie-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/movie_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:movie_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:movie_service}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.8-flash

spring.ai.google.genai.chat.temperature=0.3
